# NOTE: accel_threshold_mps2 lives ONLY under behavior_analysis (the
# monitoring module reads it there). A top-level copy previously sat at the
# top of this file and silently drifted -- removed 2026-08-17.
analytics_service:
  node_congestion_broadcast:
    enabled: false
    interval: 300
anomaly_detection:
  enabled: false
  model_path: models/anomaly_detector_model.h5
behavior_analysis:
  # Hard-braking alert threshold; monitoring.py negates this (a decel more
  # negative than -abs(this) fires the "Sudden deceleration" anomaly). 4.0 was
  # far too lenient (a normal brake = alert); 6.0 still sat in the noise floor
  # (Sep-03 run: 57 events/34min spread uniformly -6.0..-8.5, heaviest at the
  # threshold edge). 8.0 keeps the tail (~6/34min) -- real hard-braking only.
  # 10.0 (Sep-04): the sample-loop brake scene fires a -8.0 m/s² event every
  # minute per feed; raising to -10.0 puts sample-loop noise below the
  # threshold while preserving real hard-brakes (a genuine panic stop is
  # typically -8 to -10 m/s², and a real accident-grade brake is -12 to -15).
  accel_threshold_mps2: 10.0
  # False-hard-braking guards (core_module.py computes acceleration). A raw
  # per-frame speed delta flags "sudden deceleration" from track-churn / slow-
  # crawl noise; these suppress it unless the vehicle was genuinely moving fast
  # enough (floor), over a meaningful dt, and within a physical decel range.
  min_speed_for_accel_kmh: 15
  min_accel_dt_seconds: 0.15
  min_physical_accel_mps2: -15.0
  # Same vehicle must not re-fire a hard-braking anomaly within this window
  # (monitoring.py reads it); without it the anomaly list floods on dense
  # scenes where speed wobble is tracking noise, not braking.
  hard_braking_cooldown_seconds: 10
  ewma_alpha: 0.2
  lane_change_buffer: 20
  speed_limit: 60
  stopped_speed_threshold_kmh: 5
calibration:
  drift_threshold_px: 3.0
database:
  cache_size: 128
  chunk_size: 100
  db_path: backend/data/vehicle.db
  schema:
    car_color: TEXT
    car_model: TEXT
    confidence: REAL
    first_seen: REAL
    frame_index: INTEGER
    lane: INTEGER
    last_seen: REAL
    license_plate: TEXT
    speed: REAL
    timestamp: REAL
    vehicle_id: TEXT PRIMARY KEY
    vehicle_type: TEXT
    x1: REAL
    x2: REAL
    y1: REAL
    y2: REAL
  timescaledb:
    enabled: false
    url: postgresql+asyncpg://postgres:password@localhost:5432/traffic_hub
feed_manager:
  db_write_interval: 0.5
  error_check_interval: 5.0
  # Workload headroom: raised from 5 (was 3 feeds; now 5 configured). Kept at
  # 8 -- NOT filled to the brim: 5 feeds x 15fps at imgsz 960 (fp32) is
  # already ~1 card of compute; adding feeds past ~7 just piles onto the
  # drop-counter (skip_threshold) instead of the GPU. Fill toward 8 after a
  # TRT-960 re-export (fp16 ~10x cheaper per detect).
  max_concurrent_feeds: 8
file_watcher:
  enabled: false
  watch_directory: data/new_sample_videos
firebase_admin:
  auth_enabled: true
  project_id: gen-lang-client-0230118708
  service_account_key_path: configs/firebase/service-account-key.json
  storage_bucket: r1v0-1.appspot.com
# Legacy top-level fps (kept for backward compatibility). Must match
# video_output.fps and video_processing.target_fps.
# Reduced from 8 to 5 to match sustainable inference throughput (~2-5 fps/worker).
fps: 5
incident_detection:
  congestion_speed_threshold: 20
  density_threshold: 10
  # Per-(feed, anomaly type) rate-limit window for creating incidents (s).
  # 60 = at most one incident per anomaly type per feed per minute.
  anomaly_incident_min_interval_seconds: 60
incident_management:
  # Cross-incident debounce window for the SAME feed+subtype (s). Default 300
  # = the same wrong-way/sppeded_vehicle alert from the same feed will not
  # create a NEW incident for 5 minutes -- the existing one is reused. Set
  # lower for faster re-notification, higher for quieter incident panels.
  debounce_interval: 300
  # Per-vehicle snapshot cooldown (s). The incident itself is rate-limited
  # by (feed, subtype) above; this gates the DISK WRITE only, so a wrong-way
  # storm producing N distinct vehicles still creates N incidents (one per
  # vehicle), but only one snapshot per vehicle per episode. Sep-04 storm:
  # 850 incidents -> 850 jpg writes in 19 min; with this + the upstream
  # speed floor (safety_analytics.wrong_way_min_speed_pxs) the write rate
  # drops to one snapshot per vehicle per 5 min.
  snapshot_cooldown_sec: 300
inference:
  # Batch 2: at a 50ms fill timeout ~1-2 tasks arrive per tick per worker, so
  # batch 8 never filled (GPU ran batch-1/2 forwards paying launch overhead
  # with none of the amortization). Keep 1 for static-batch TRT engines
  # (forced in-code). Raise only with timeout + depth evidence.
  batch_size: 2
  detection_model: models/yolov8n.pt
  device: cuda:0
  # 2 T4 GPUs: start with `num_workers` (=2) — one Worker per GPU at
  # 1:1. The pool grows under load up to inference_pool_size (8); see
  # inference_pool_manager.scale_pool. With SLOT_COUNT=6 (see constants.py) and 2 workers,
  # each worker owns 2 slots and the existing route formula
  # `(wid + sub*pool_size) % SLOT_COUNT` co-locates 2+ feeds onto the
  # same worker, so the configured batch_size (8) actually fills (was
  # collapsing to batch=1 when num_workers==SLOT_COUNT, e.g. 4 workers
  # for 3 feeds left each worker with 1 slot = 1 queue = empty batch).
  #
  # GATE: build the TensorRT engine once on the T4 box with
  #   python scripts/export_tensorrt.py
  # -> models/yolov8n.engine. The inference worker auto-loads .engine
  # over .pt when it exists (inference_worker.py:205), dropping per-call
  # latency ~4-8× vs float32 PyTorch forward.
  num_workers: 2
  worker_ready_timeout: 60
  use_tensorrt: true
  inference_timeout: 0.05
  # skip_frames=0: detect EVERY ingested frame (was 3). The GPUs sit at
  # ~0% util on the 3 sample feeds (~8fps each); the old skip=3 ran only
  # ~5 YOLO forwards/sec/feed. With skip=0 and target_fps 8 that becomes
  # 8 detects/sec/feed (24/sec across 3 feeds) -- still trivial for a T4
  # (~2-6% util at 640x640), but 4x the current GPU work. If you want the
  # cards genuinely loaded, raise yolo_imgsz / re-export the TRT engine
  # at 640+ (the engine caps input at 320) or add more feeds.
  skip_frames: 0
ingestion:
  shared_memory_ipc: true
interface:
  camera_warmup_time: 0.5
lane_detection:
  canny_high_threshold: 150
  canny_low_threshold: 50
  # Disabled: Hough params don't match sample video geometry,
  # producing "Detected lines are too close or inverted" warnings.
  enabled: false
  gaussian_blur_kernel_size: 5
  hough_max_line_gap: 20
  hough_min_line_length: 40
  hough_rho: 2
  hough_theta_divisor: 180
  hough_threshold: 15
  lane_change_buffer: 10
  lane_width: 120
  model_type: mobilenet_v3_small
  num_lanes: 6
  roi_vertices_percent:
  - - 0.1
    - 1.0
  - - 0.45
    - 0.6
  - - 0.55
    - 0.6
  - - 0.9
    - 1.0
  # Lane detection runs every N frames to save compute (Hough + line clustering).
  # Default 10 = detect lanes on 1 of every 10 frames at 8fps = 0.8Hz.
  frame_interval: 10
  # CoreModule uses this (seconds) to throttle its own lane CV recompute.
  # Default 1.0s = lanes refreshed at most once per second.
  detection_interval_seconds: 1.0
lane_bands:
  # Position-derived lane ids (CoreModule._assign_lane_band). The CV lane
  # detector is disabled and nothing else assigns track["lane"], so without
  # this every vehicle rides lane=-1. N vertical bands over the ROI x-range
  # (frame width when no ROI); lane ids 0..N-1, -1 = unknown/off. N=6 matches
  # a 3+3 two-way road (one band per real lane); a band that still straddles
  # both directions trips the two-way verdict instead of storming.
  enabled: true
  num_bands: 6
log_files:
  allowed_log_files:
  - backend_main.log
  - uvicorn_access.log
  - uvicorn_error.log
  - app.log
