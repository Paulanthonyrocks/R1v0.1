  min_ocr_bbox_height: 50
  min_ocr_bbox_width: 100
  ocr_sweet_spot_y_start: 0.5
  roi_top_margin_factor: 0.5
  roi_bottom_margin_factor: 0.1
  roi_left_margin_factor: 0.15
  roi_right_margin_factor: 0.15
incident_detection:
