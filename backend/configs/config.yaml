database:
  db_path: backend/data/vehicle_data.db
  chunk_size: 100
  cache_size: 128
  schema:
    vehicle_id: TEXT PRIMARY KEY
    timestamp: REAL
    frame_index: INTEGER
    license_plate: TEXT
    vehicle_type: TEXT
    first_seen: REAL
    last_seen: REAL
    x1: REAL
    y1: REAL
    x2: REAL
    y2: REAL
    speed: REAL
    lane: INTEGER
    confidence: REAL
    car_model: TEXT
    car_color: TEXT
feed_manager:
  max_concurrent_feeds: 10
  db_write_interval: 0.5
  error_check_interval: 5.0
queue_log_interval: 120.0
video_input:
  sample_video: backend/data/sample_traffic.mp4
  webcam_index: 0
  webcam_buffer_size: 20
  max_queue_size: 1000
  queue_put_timeout_ms: 1000
video_output:
  enabled: true
  processing_enabled: true
  output_directory: backend/data/processed_videos
  codec: mp4v
  fps: 5
  frame_resolution:
  - 640
  - 480
vehicle_detection:
  enabled: true
  model_path: backend/models/yolov8n.pt
  frame_resolution:
  - 640
  - 480
  vehicle_class_ids:
  - 2
  - 3
  - 5
  - 7
  confidence_threshold: 0.4
  proximity_threshold: 50
  track_timeout: 20
  max_active_tracks: 50
  yolo_imgsz: 640
  skip_frames: 5
analytics_service:
  traffic_predictor:
    model_path: backend/models/traffic_predictor_model.h5
  traffic_prediction:
    enabled: false
  frame_resolution:
  - 640
  - 480
  vehicle_class_ids:
  - 2
  - 3
  - 5
  - 7
  confidence_threshold: 0.4
  proximity_threshold: 75
  track_timeout: 20
  max_active_tracks: 50
  yolo_imgsz: 640
  skip_frames: 3
  vehicle_type_map:
    2: car
    3: motorcycle
    5: bus
    7: truck
behavior_analysis:
  stopped_speed_threshold_kmh: 5
  speed_limit: 60
  accel_threshold_mps2: 0.5
  lane_change_buffer: 20
  ewma_alpha: 0.2
kalman_filter_params:
  kf_sigma_px: 2.0
  kf_sigma_py: 2.0
  kf_sigma_pvx: 5.0
  kf_sigma_pvy: 5.0
  kf_sigma_mx: 0.5
  kf_sigma_my: 0.5
  kf_sigma_ax: 0.5
  kf_sigma_ay: 0.5
lane_detection:
  dynamic_lane_detection_enabled: false
  num_lanes: 4 # Fallback if dynamic detection fails or is disabled
  lane_width: 120 # Fallback if dynamic detection fails or is disabled
  lane_change_buffer: 10
  gaussian_blur_kernel_size: 5
  canny_low_threshold: 50
  canny_high_threshold: 150
  hough_rho: 2
  hough_theta_divisor: 180
  hough_threshold: 15
  hough_min_line_length: 40
  hough_max_line_gap: 20
  roi_vertices_percent: # [x_percent, y_percent] for top-left, top-right, bottom-right, bottom-left
    - [0.1, 1.0] # Bottom-left
    - [0.45, 0.6] # Top-left
    - [0.55, 0.6] # Top-right
    - [0.9, 1.0] # Bottom-right
pixels_per_meter: 30
stopped_speed_threshold_kmh: 5
accel_threshold_mps2: 0.5
