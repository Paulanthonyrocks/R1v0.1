  directive_interval_sec: 2.0
  enabled: false
vehicle_detection:
  bbox_expansion_factor: 0.05
  car_classification_enabled: false
  car_classification_interval_frames: 60
  car_classifier_labels_path: models/car_labels.txt
  car_classifier_model_path: models/Car_Make_Model.tflite
  confidence_threshold: 0.3
  enabled: true
  # Calibration: maps image pixels -> real-world ground plane (meters) via a
  # homography. Required for physically-meaningful speed (km/h). Without it the
  # pipeline falls back to pixel-based velocity (avg_speed broadcasts as 0.0).
  # image_points are NORMALIZED [0,1] and scaled by `resolution` at load time
  # -- so raising `frame_resolution` does NOT require editing image_points.
  # Edit these per-camera to match your scene; values below are a sane default
  # trapezoid for a forward-facing 640x480 traffic cam.
  calibration:
    resolution:
    - 640
    - 480
    image_points:
    - - 0.25
      - 0.25
    - - 0.75
      - 0.25
    - - 0.85
      - 0.95
    - - 0.15
      - 0.95
    world_points:
    - - -6.0
      - 40.0
    - - 6.0
      - 40.0
    - - 6.0
      - 0.0
    - - -6.0
      - 0.0
  frame_resolution:
  - 640
  - 480
  low_confidence_threshold: 0.1
  max_active_tracks: 100
  max_aspect_ratio: 10.0
  max_reid_per_frame: 2
  min_bbox_area: 100
  min_bbox_dimension: 5
  model_path: models/yolov8n.pt
  model_type: yolo
  nms_threshold: 0.45
  occlusion_confidence_threshold: 0.2
  openvino_model_path: backend/models/OpenVino/yolov8n.xml
  predict_timeout: 0.8
  probation_threshold: 2
  proximity_threshold: 80
  reid:
    appearance_weight: 0.3
    backbone: mobilenet_v3_small
    embedding_dim: 128
    input_size:
    - 256
    - 256
    min_track_age_for_appearance: 5
    model_path: ''
    similarity_threshold: 0.80
    use_appearance_in_tracking: true
    use_openvino: false
    # Full sync interval (seconds): throttle the expensive full Redis gallery
    # re-pull to prevent the "Syncing N new identities" storm (observed: 55
    # bursts in ~4 min). The pub/sub listener handles steady-state upkeep;
    # full_sync is only for cold-start catch-up. Default 30s.
    full_sync_interval_seconds: 30.0
  reid_enabled: true
  reid_interval_frames: 30
  reid_timeout: 3600
  # Per-frame ReID MATCH budget (read by inference_worker.py). Caps how many
  # NEW tracks run match_or_register per detect frame; each costs ~5 sync Redis
  # calls, and unbounded matching on dense scenes (130+ vehicles) pinned
  # workers to ~1 fps/feed. Remaining unassigned tracks get matched on later
  # frames as earlier ones receive global ids. 0 = disabled (motion-only
  # matching), higher = faster global-id assignment at more Redis cost.
  reid_match_budget_per_frame: 6
  # Fallback only — the worker reads inference.skip_frames first (see the
  # comment there); keep in sync so the fallback path also detects every
  # frame instead of skipping 2/3.
  skip_frames: 0
  static_movement_threshold: 25
  static_object_filter_enabled: true
  static_object_timeout: 20
  track_timeout: 10
  # NOTE (crack #5): flag drift resolved. The predictor is gated by
  # analytics_service.traffic_prediction.enabled (read by services.py and
  # analytics_service.py). This nested copy is the SAME flag — keep its value
  # synced to that canonical one (false) so operators see one source of truth.
  traffic_prediction:
    enabled: false
  traffic_predictor:
    model_path: models/traffic_predictor_model.h5
  use_openvino: true
  vehicle_class_ids:
  - 2
  - 3
  - 5
  - 7
  # 640 -> 960 (workload increase): 2.25x per-detect GPU compute AND a real
  # accuracy gain on the 640x480 sources (1.5x supersample helps small/distant
  # vehicles). NOTE: a deployed TensorRT engine is shape-locked to its export
  # imgsz (320) and caps here at 320 (inference_worker.py trt_imgsz_cap) --
  # re-export the engine at 960 for this to bite. 1280 is available if you
  # want brute force (4x).
  yolo_imgsz: 960
video_input:
  max_queue_size: 500
  queue_put_timeout_ms: 1000
  webcam_buffer_size: 20
  webcam_index: 0
video_output:
  codec: mp4v
  enabled: false
  # fps at which the wire frame is emitted. Must match video_processing.target_fps
  # (result_processor.py dedups to ``video_output.fps``); they used to disagree
  # (15 vs 8) which silently capped effective throughput at the lower of the two.
  # Reduced from 15 to 8 to match sustainable ingestion/inference throughput.
  # Reduced from 8 to 5 to match sustainable inference throughput (~2-5 fps/worker).
  fps: 5
  frame_resolution:
  - 640
  - 480
  output_directory: backend/data/processed_videos
  processing_enabled: true
  # Wire JPEG for the dashboard. 640x480 at quality 80 is the cost ceiling for
  # the loca.lt tunnel; if you bump resolution further, lower jpeg_quality in
  # ingestion_worker.py accordingly (it's an inline constant there).
  stream_resolution:
  - 640
  - 480
video_processing:
  # target_fps 8 -> 15 (workload increase): +87% frames through ingestion and,
  # with inference.skip_frames=0, +87% detection work on the GPUs. The old
  # tunnel-bandwidth rationale is largely mitigated by the per-client rate
  # gate (tunnel clients are capped at 1-3fps per feed regardless). If tunnel
  # latency regresses, drop back to 8.
  # Reduced from 15 to 8 to match sustainable ingestion/inference throughput.
  # Reduced from 8 to 5 to match sustainable inference throughput (~2-5 fps/worker).
  target_fps: 5
  # Adaptive streaming: when TRUE the pipeline ships TWO JPEGs per frame
  # (full-res and a downscaled "small" tier) and lets the broadcaster pick by
  # client RTT. This is a bandwidth-conservation optimization for mixed
  # clients on the SAME origin -- a low-RTT LAN client gets full-res, a
  # high-RTT mobile client gets the small tier.
  #
  # Over a SINGLE loca.lt tunnel there is exactly one client, always
  # high-RTT, so the "small" tier is selected every frame -- meaning we
  # encode BOTH JPEGs and ship one. The second encode is pure waste.
  # Set FALSE to ship a single tier and cut the per-frame encoder cost in
  # half on the worker.
  adaptive_streaming: false
  # Downscale factor for the bandwidth-light ("small") background JPEG sent to
  # high-latency tunnel clients (loca.lt / cloudflare / ngrok).
  # The pipeline already force-resizes every frame to stream_resolution
  # (320x240) at ingestion, so the source ceiling is 320x240. A 0.5 factor
  # pushed tunnel clients down to 160x120 -- a 4x quality loss for a
  # negligible bandwidth saving on a 320x240 frame (~10-20KB JPEG). Set to
  # 1.0 so tunnel clients receive the full 320x240; this removes the visible
  # mushiness without materially increasing tunnel payload size.
  roi_scale: 1.0
  # JPEG quality for the small background. 50 was visibly mushy; 70 was a sane
  # floor; 78 keeps bandwidth-light frames watchable at full 320x240.
  adaptive_jpeg_quality: 78
  # RTT (ms) below which a client receives the full-res frame. Borderline
  # tunnels (100-250ms) were being forced onto the small tier at 120; raise so
  # only genuinely high-RTT links drop to the downscaled payload.
  adaptive_latency_threshold_ms: 250

vis_options_default:
- Grid Overlay
- Lane Lines
weather_service:
  enabled: false
websocket:
  max_connections: 1000
  # Aligned with frontend (WebSocketClient.ts: 10s ping, 60s pong timeout)
  # and main.py default (ping_interval=15, pong_timeout=60).
  # With 50-67s RTT over tunnel, 60s timeout is tight; 120s was too loose.
  ping_interval: 15
  pong_timeout: 60
  token_refresh_interval: 300

