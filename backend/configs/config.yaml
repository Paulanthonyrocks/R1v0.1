  use_tesseract: true
openvino:
  reid_model_path: models/OpenVino/reid_model.xml
  yolo_model_path: models/OpenVino/yolov8n.xml
pavement_analysis:
  camera_calibration:
    calibration_file: calibration_params.npz
auto_start_processing: true
performance:
  auto_optimize: true
  batch_size: 16
  # ReID embedding budget per detect frame (core_module.py reads these via
  # config["performance"].get("reid_budget_per_frame", 10) and
  # ("reid_assoc_budget_per_frame", 20)). The shipped key
  # vehicle_detection.max_reid_per_frame: 2 was DEAD — no code reads it — so
  # the real budget silently ran at the 10+20 code defaults, i.e. up to 30
  # mobilenet_v3_small forwards at 256x256 per detect frame. That is the bulk
  # of the ~0.85s/detect cost that pins each worker to ~1.2 fps/feed (TRT YOLO
  # itself is ~2.4ms). Wire the operator's intended cap here.
  reid_budget_per_frame: 2
  reid_assoc_budget_per_frame: 4
  cpu_limit_percent: 95
  cpu_threshold_for_skip_increase: 85
  gpu_acceleration: true
  image_gpu_acceleration: true
  # Pool size = number of distinct slots, so every worker owns exactly one
  # slot and there is no modulo collision or fan-out reuse.
  # Reduced from 8 to 4 (2 per GPU) to eliminate CUDA context thrashing
  # from 12 concurrent CUDA inits. With SLOT_COUNT=6 and 2 GPUs, 4 workers
  # = 1:1 worker:slot affinity. Each GPU runs 2 workers pinned to it.
  inference_pool_size: 4
  # Pin the autoscaler: when true, the scaling monitor never scales the
  # inference pool up OR down (see feed_manager._scaling_monitor_loop). Each
  # scale action respawns a worker that reloads YOLO+ReID onto the GPU; under
  # oscillating load that churns dozens of reloads and -- if a model file is
  # corrupt -- kills workers mid-run. Set inference_pool_size to cover peak
  # load and pin it. Default false = legacy adaptive scaling.
  pin_inference_pool: true
  # Autoscaler ceiling for the inference pool. SLOT_COUNT is 6, so with
  # strict 1:1 routing only workers 0..3 could ever own a slot and workers
  # 4..7 idled (loaded a model, did no work) — which made raising this past 4
  # pointless. InferencePoolManager.scale_pool now FAN-OUTS overflow workers
  # onto the existing slot streams (validated: the `workers` consumer group
  # round-robins messages to all consumers of a stream), so a hot feed's
  # queue is drained by 2 workers. With 3 feeds and pool_size 8 each feed's
  # single slot gets a 2nd worker, halving per-feed queue depth and the
  # 60s SHM-stale timeout that was dropping ~26% of Feed_1 frames. Memory
  # guard (memory_limit_percent) still caps real spawns under pressure.
  scale_up_threshold: 60
  long_sleep_after_increase: 10
  max_global_skip_factor: 2.0
  memory_limit_percent: 85
  min_global_skip_factor: 1.0
  queue_fullness_threshold_for_skip_increase: 0.8
  queue_max_size: 500
  # Worker's drop-on-pressure cut-in. Fires once the per-slot queue depth
  # (lag + pending, i.e. the slot's SHM segment footprint) exceeds the
  # threshold and the worker's first detection for that feed has happened.
  # 5000 was set under 1-feed-per-worker routing when queues drained within
  # seconds; with multi-worker slots (SLOT_COUNT=6) it now sits ABOVE
  # shm_pool_size (2000), so the smart-skip valve opens only after the SHM
  # free pool is already empty (observed: first 'free pool empty' at ~50s of
  # feed time in both Aug-17 runs). Derived from the pool instead: 2000
  # segments shared across active slots (~666/slot at 3 feeds, ~400/slot at
  # the configured 5). 400 caps a slot's footprint below its fair share so
  # skipping sheds frames while segments are still free, and the skip path
  # (ack + frame_buffer.release) recycles them immediately.
  # With shm_pool_size=4000 and ~3 active feeds: ~1333/slot. Set to 1000 to
  # open the skip valve while segments are still available.
  skip_threshold: 1000
  skip_factor_adjustment_interval: 360.0
  skip_factor_decrease_step: 0.05
  skip_factor_increase_step: 0.1
  use_shared_memory: true
  use_shm: true
  # Raised from 4000 to 6000 to provide more headroom for 3 feeds at 8fps
  # with decode-skip backpressure at 20%.
  shm_pool_size: 6000
  # Decode-side throttle floor (F1/F3 fix). When the SHM free pool drops below
  # this fraction, the ingestion decoder SKIPS reading/decoding the frame
  # entirely (instead of decoding it and dropping it at acquire()). Lets the
  # pool drain at the inference rate (~3fps) rather than the decoder rate
  # (~45fps), which is the root cause of the bulk of "SHM free pool empty"
  # drops. Set to 0.0 to disable (legacy post-acquire backpressure only).
  # Raised from 0.20 to 0.25 to trigger decode-skip earlier and prevent pool exhaustion.
  shm_min_free_fraction: 0.25
  # Hysteresis resume threshold for the decode-shed latch. Shedding engages below
  # shm_min_free_fraction and only releases once the free fraction climbs back to
  # this level. Must exceed shm_min_free_fraction.
  shm_resume_fraction: 0.40
  # Starvation guard: a feed latched in the hysteresis band force-resumes after
  # this many seconds even if the pool never reaches shm_resume_fraction —
  # prevents one feed blacking out indefinitely while others oscillate inside
  # the band (observed on Feed_3, 2026-08-23 22:37-22:42 run).
  shm_shed_max_age_seconds: 30.0
  # How long a segment may sit unwritten/abandoned before prune_stale_segments
  # reclaims it. Raised well above worst-case reader lag so an in-flight frame
  # is never reclaimed (which previously caused feed_hash mismatches + drops).
  # NOTE: pool_size was briefly dropped to 500 during tuning; that starved the
  # free pool (1158 'free pool empty' drops) because a segment is checked out
  # from ingestion all the way through result_processor read. 2000 exhausts
  # under sustained ingest-vs-inference mismatch (45 fps in vs ~3 fps drain:
  # first 'free pool empty' at ~50s in both Aug-17 runs) -- the skip valve
  # above is the relief, not pool growth.
  shm_stale_timeout: 60.0
  video_gpu_acceleration: true
personalized_routing:
  enabled: false
perspective_calibration:
