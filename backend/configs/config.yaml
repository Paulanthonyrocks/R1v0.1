  version: 1
ml_model:
  model_path: models/pavement/pavement_model.pt
mongodb:
  database_name: traffic_hub
  enabled: false
  uri: mongodb://localhost:27017/
# Post-NMS detection cleanup (worker_utils.postprocess_detections).
# - Geometry filter (max_aspect/min_dim) drops thin/elongated false positives
#   (a white lane marking) before it becomes a track.
# - Split-merge unions same-class boxes that overlap (merge_iou) OR abutting
#   splits of BIG vehicles only (merge_gap_px + merge_gap_classes = bus/truck:
#   COCO ids 5,7). Cars are NEVER gap-merged, so distinct cars driving close
#   together are not grouped into one box. Raise merge_gap_px if a truck still
#   splits; lower it if two trucks get merged.
detection_postprocess:
  enabled: true
  max_aspect: 6.0
  min_dim: 6.0
  merge_iou: 0.50
  # gap-merge disabled (0.0): it was merging two DISTINCT trucks (both class 7)
  # that sit close together into one box. Only strong-IoU (>0.50) same-class
  # overlaps merge now -- a genuine split (cab/trailer that overlaps >50%) still
  # merges, but two separate trucks/small vehicles never get grouped.
  merge_gap_px: 0.0
  merge_gap_classes: [5, 7]
ocr_engine:
  # Disabled (2026-09-02): at the 640x480 source resolution the ~20-60px plates
  # aren't legible to EasyOCR even after plate localization -- every read is
  # empty and it burns ~1.2 CPU reads/sec/feed. Flip to true only with a
  # plate-specific recognizer or higher-resolution source frames.
  enabled: false
  # Gemini OCR: set use_gemini_ocr: true + a key to route plate reading through
  # Gemini (tried first, falls back to local OCR on failure). Set gemini_model to
  # any Flash model your account has (e.g. gemini-2.5-flash, or a newer 3.x Flash
  # id) — it's a config flip, no code change. Requires the `google-genai` package.
  gemini_api_key: ""
  gemini_model: "gemini-2.5-flash"
  gemini_max_retries: 3
  gemini_retry_delay: 1.0
  min_roi_size: 600
  morph_kernel:
  - - 1
    - 1
    - 1
  - - 1
    - 1
    - 1
  - - 1
    - 1
    - 1
  ocr_interval: 10
  sharpen_kernel:
  - - -1
    - -1
    - -1
  - - -1
    - 9
    - -1
  - - -1
    - -1
    - -1
  # Plate-crop: the OCR (EasyOCR) does NOT localize plates -- it reads whatever
  # crop it's handed. At 640x480 a plate is ~20-60px inside the FULL vehicle box,
  # so we FIRST try to LOCALIZE the plate (plate_localize, a classical-CV
  # low-center high-contrast rectangle) and OCR that; if none is found we fall back
  # to a narrow bottom-center band (bumper region, not the mid-body logo that
  # EasyOCR reads as decals). Upscale to a readable width before OCR.
  plate_localize: true
  plate_crop_bottom_factor: 0.28
  plate_crop_width_factor: 0.60
  plate_upscale: 3.0
  plate_min_width: 15
  plate_min_aspect: 0.6
  plate_max_aspect: 10.0
  # EasyOCR doesn't tokenize plate-format strings by default -- constrain it to
  # alphanumerics + dash so it reads "ABC123" instead of returning empty.
  plate_allowlist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-"
  # Ensure every crop is upscaled to at least this width before OCR (EasyOCR needs
  # ~140px for reliable recognition); capped at 480.
  plate_min_target_w: 140
  use_gemini_ocr: false
  # EasyOCR GPU contends for the same 2 T4s already running YOLO+ReID (CUDA
  # thrash / throughput drop). CPU is the safe default: OCR runs in a bounded
  # thread pool, so it drains slower but never blocks inference. Flip to true
  # ONLY with GPU headroom and if you want faster plate reads.
  use_gpu_ocr: false
  # NOTE: this toggles a pytesseract fallback INSIDE the Gemini wrapper only.
  # It does NOT control the local OCR actually in play (that's EasyOCR, gated
  # by use_local). Harmless while Gemini is off.
  use_tesseract: true
openvino:
  reid_model_path: models/OpenVino/reid_model.xml
  yolo_model_path: models/OpenVino/yolov8n.xml
pavement_analysis:
  camera_calibration:
    calibration_file: calibration_params.npz
auto_start_processing: true
performance:
  auto_optimize: true
  batch_size: 16
  # ReID embedding budget per detect frame (core_module.py reads these via
  # config["performance"].get("reid_budget_per_frame", 10) and
  # ("reid_assoc_budget_per_frame", 20)). The shipped key
  # vehicle_detection.max_reid_per_frame: 2 was DEAD — no code reads it — so
  # the real budget silently ran at the 10+20 code defaults, i.e. up to 30
  # mobilenet_v3_small forwards at 256x256 per detect frame. That is the bulk
  # of the ~0.85s/detect cost that pins each worker to ~1.2 fps/feed (TRT YOLO
  # itself is ~2.4ms). Wire the operator's intended cap here.
  reid_budget_per_frame: 2
  reid_assoc_budget_per_frame: 4
  cpu_limit_percent: 95
  cpu_threshold_for_skip_increase: 85
  gpu_acceleration: true
  image_gpu_acceleration: true
  # Pool size = number of distinct slots, so every worker owns exactly one
  # slot and there is no modulo collision or fan-out reuse.
  # Reduced from 8 to 4 (2 per GPU) to eliminate CUDA context thrashing
  # from 12 concurrent CUDA inits. With SLOT_COUNT=6 and 2 GPUs, 4 workers
  # = 1:1 worker:slot affinity. Each GPU runs 2 workers pinned to it.
  inference_pool_size: 4
  # Pin the autoscaler: when true, the scaling monitor never scales the
  # inference pool up OR down (see feed_manager._scaling_monitor_loop). Each
  # scale action respawns a worker that reloads YOLO+ReID onto the GPU; under
  # oscillating load that churns dozens of reloads and -- if a model file is
  # corrupt -- kills workers mid-run. Set inference_pool_size to cover peak
  # load and pin it. Default false = legacy adaptive scaling.
  pin_inference_pool: true
  # Autoscaler ceiling for the inference pool. SLOT_COUNT is 6, so with
  # strict 1:1 routing only workers 0..3 could ever own a slot and workers
  # 4..7 idled (loaded a model, did no work) — which made raising this past 4
  # pointless. InferencePoolManager.scale_pool now FAN-OUTS overflow workers
  # onto the existing slot streams (validated: the `workers` consumer group
  # round-robins messages to all consumers of a stream), so a hot feed's
  # queue is drained by 2 workers. With 3 feeds and pool_size 8 each feed's
  # single slot gets a 2nd worker, halving per-feed queue depth and the
  # 60s SHM-stale timeout that was dropping ~26% of Feed_1 frames. Memory
  # guard (memory_limit_percent) still caps real spawns under pressure.
  scale_up_threshold: 60
  long_sleep_after_increase: 10
  max_global_skip_factor: 2.0
  memory_limit_percent: 85
  min_global_skip_factor: 1.0
  queue_fullness_threshold_for_skip_increase: 0.8
  queue_max_size: 500
  # Worker's drop-on-pressure cut-in. Fires once the per-slot queue depth
  # (lag + pending, i.e. the slot's SHM segment footprint) exceeds the
  # threshold and the worker's first detection for that feed has happened.
  # 5000 was set under 1-feed-per-worker routing when queues drained within
  # seconds; with multi-worker slots (SLOT_COUNT=6) it now sits ABOVE
  # shm_pool_size (2000), so the smart-skip valve opens only after the SHM
  # free pool is already empty (observed: first 'free pool empty' at ~50s of
  # feed time in both Aug-17 runs). Derived from the pool instead: 2000
  # segments shared across active slots (~666/slot at 3 feeds, ~400/slot at
  # the configured 5). 400 caps a slot's footprint below its fair share so
  # skipping sheds frames while segments are still free, and the skip path
  # (ack + frame_buffer.release) recycles them immediately.
  # With shm_pool_size=4000 and ~3 active feeds: ~1333/slot. Set to 1000 to
  # open the skip valve while segments are still available.
  skip_threshold: 1000
  skip_factor_adjustment_interval: 360.0
  skip_factor_decrease_step: 0.05
  skip_factor_increase_step: 0.1
  use_shared_memory: true
  use_shm: true
  # Raised from 4000 to 6000 to provide more headroom for 3 feeds at 8fps
  # with decode-skip backpressure at 20%.
  shm_pool_size: 6000
  # SHM segment size in bytes. MUST match the actual frame footprint (640x480
  # RGB = ~0.92MB; 1.5MB covers any color format + header). The old 10MB default
  # made shm_pool_size 6000 plan 60GB > /dev/shm (14GB), so only ~1400 segments
  # materialized and the shed valve computed free_fraction against an unreachable
  # 6000 denominator -> perpetually below the resume floor -> "skip decode"
  # stalls. Frame-sized segments let the whole 6000-slot pool fit in /dev/shm.
  shm_frame_size: 1500000
  # Decode-side throttle floor (F1/F3 fix). When the SHM free pool drops below
  # this fraction, the ingestion decoder SKIPS reading/decoding the frame
  # entirely (instead of decoding it and dropping it at acquire()). Lets the
  # pool drain at the inference rate (~3fps) rather than the decoder rate
  # (~45fps), which is the root cause of the bulk of "SHM free pool empty"
  # drops. Set to 0.0 to disable (legacy post-acquire backpressure only).
  # Raised from 0.20 to 0.25 to trigger decode-skip earlier and prevent pool exhaustion.
  shm_min_free_fraction: 0.25
  # Hysteresis resume threshold for the decode-shed latch. Shedding engages below
  # shm_min_free_fraction and only releases once the free fraction climbs back to
  # this level. Must exceed shm_min_free_fraction.
  shm_resume_fraction: 0.40
  # Starvation guard: a feed latched in the hysteresis band force-resumes after
  # this many seconds even if the pool never reaches shm_resume_fraction —
  # prevents one feed blacking out indefinitely while others oscillate inside
  # the band (observed on Feed_3, 2026-08-23 22:37-22:42 run).
  shm_shed_max_age_seconds: 30.0
  # How long a segment may sit unwritten/abandoned before prune_stale_segments
  # reclaims it. Raised well above worst-case reader lag so an in-flight frame
  # is never reclaimed (which previously caused feed_hash mismatches + drops).
  # NOTE: pool_size was briefly dropped to 500 during tuning; that starved the
  # free pool (1158 'free pool empty' drops) because a segment is checked out
  # from ingestion all the way through result_processor read. 2000 exhausts
  # under sustained ingest-vs-inference mismatch (45 fps in vs ~3 fps drain:
  # first 'free pool empty' at ~50s in both Aug-17 runs) -- the skip valve
  # above is the relief, not pool growth.
  shm_stale_timeout: 60.0
  video_gpu_acceleration: true
perspective_calibration:
  matrix_path: configs/perspective_matrix.npy
pixels_per_meter: 30
post_startup_processing:
  enabled: true
  sample_feeds:
    - is_looped: true
      latitude: 34.0522
      longitude: 118.2437
      path: backend/data/sample_traffic.mp4
      name: sample_traffic.mp4 (load-4)
    - is_looped: true
      latitude: 34.053
      longitude: 118.244
      path: backend/data/sample_traffic_2.mp4
      name: sample_traffic_2.mp4 (load-5)
    - is_looped: true
      latitude: 34.051
      longitude: 118.243
      path: backend/data/sample_traffic_3.mp4
    # Workload test (GPU utilization): 2 extra feeds decoding existing live
    # files, taking the pool to max_concurrent_feeds (5). Each adds ~8-15fps
    # of ingestion + detection work. Same source files are safe: feed ids are
    # manager-assigned, sources may repeat. Remove these two entries to revert.
    - is_looped: true
      latitude: 34.0522
      longitude: 118.2437
      path: backend/data/sample_traffic.mp4
      name: sample_traffic.mp4 (load-6)
    - is_looped: true
      latitude: 34.053
      longitude: 118.244
      path: backend/data/sample_traffic_2.mp4
      name: sample_traffic_2.mp4 (load-7)

prediction_scheduler:
  accuracy_cache_ttl_minutes: 60
  default_low_data_weight: 0.75
  default_no_accuracy_weight: 0.8
  enabled: false
  likelihood_threshold: 70
  max_locations_to_select_factor: 0.5
  min_verified_predictions_for_accuracy: 5
  monitored_locations:
  - latitude: 34.0522
    longitude: -118.2437
    name: Los Angeles Downtown
  - latitude: 40.7128
    longitude: -74.006
    name: New York Times Square
  - latitude: 41.8781
    longitude: -87.6298
    name: Chicago The Loop
  - latitude: 37.7749
    longitude: -122.4194
    name: San Francisco Embarcadero
  - latitude: 33.749
    longitude: -84.388
    name: Atlanta Centennial Park
  prediction_interval_minutes: 15
queue_log_interval: 120.0
redis:
  db: 0
  enabled: true
  host: localhost
  port: 6379
  # Connection pool settings for ReID stability (fixes reconnect storm)
  # Max connections in pool: 10 (enough for 4 inference workers + services)
  max_connections: 10
  # Retry on timeout/connection errors
  retry_on_timeout: true
  # Socket keepalive to detect stale connections
  socket_keepalive: true
  # Connection timeout (seconds)
  socket_connect_timeout: 5
  # Socket read timeout (seconds)
  socket_timeout: 5
  # Health check interval for idle connections
  health_check_interval: 30
kpi_broadcast_interval: 5
# EMA window for per-feed metric smoothing (result_processor). Was silently at
# the code default 300s -> alpha=1/300, which froze broadcast KPIs near-static
# (congestion pinned 72.9-73.5 for 23 min). 10-30s tracks live conditions.
metrics_averaging_window_seconds: 30
# Rolling window for TrafficMonitor's recent_average_* live KPIs (the
# feed_manager headline uses these instead of since-boot session averages).
metrics_recent_window_seconds: 60
roi_processing:
  crop_rect:
  - 0
  - 0
  - 640
  - 480
  enabled: false
  polygon_points: null
safety_analytics:
  # Wrong-way cosine threshold (SafetyMonitor._check_wrong_way): dot of vehicle
  # velocity vs lane flow vector below this flags wrong-way. Default -0.8.
  wrong_way_cosine_threshold: -0.8
  # Wrong-way minimum speed (px/s): a stopped/slow vehicle's velocity is
  # tracker-id jitter, not a directional choice. The previous floor of 1.0
  # px/s let jitter dominate and produced confident-but-spurious wrong-way
  # flags (Sep-04: 850 flags in 19 min, 62% at |speed| < 10 px/s, dot clustered
  # at -0.96 from micro-motion in the lane's reverse direction). 10 px/s sits
  # well above typical 1-2 px jitter and below a 5 fps moving vehicle's
  # natural per-second displacement; a genuine wrong-way driver is moving.
  wrong_way_min_speed_pxs: 10.0
  # Lane-calibrator confidence required before the learned flow vector is used.
  calibration_confidence: 0.8
  # Require a real lane id for wrong-way flagging. All Sep-03 samples rode
  # lane=-1 (no lane model), where the consensus is global-per-feed and flags
  # oncoming traffic (20/20 flags on Feed_2). true = skip lane=-1.
  wrong_way_require_lane: true
  # Flow-vector diagnostic log throttle (seconds): on-change logs alone wrote
  # 841 lines/34min from ~0.01/frame vector jitter.
  flow_log_interval_sec: 60.0
  # Two-way lane verdict (LaneCalibrator.is_two_way): a lane whose samples
  # sustainably oppose its own consensus is bidirectional, so wrong-way is
  # meaningless there and flagging is skipped. Fraction bar sits low because
  # live imbalanced streams (5% opposed, conf 0.9+) still flag the minority;
  # the sustain leg (consecutive over-bar add_sample calls) proves a stream
  # vs a 2-second lane-changer and resets the moment the share drops.
  two_way_opposed_fraction: 0.03
  two_way_min_samples: 40
  two_way_sustain_calls: 2000
speed_limit: 60
stopped_speed_threshold_kmh: 5
storage:
  image_output_dir: data/pavement_images
  report_output_dir: data/pavement_reports
tracking:
  use_appearance_in_tracking: true
  dynamic_matching_threshold: 0.85
  low_conf_association_threshold: 0.3
  giou_threshold: -0.2
  max_gate_dist: 260
  proximity_threshold: 80
  track_timeout: 20
  track_timeout_unit: "frames"
  kalman_r: 0.1
  kalman_q_pos: 0.01
  kalman_q_vel: 0.05
  velocity_gate_boost: 3.0
  base_gate_multiplier: 1.0
  appearance_weight: 0.5
  embedding_dim: 128
traffic_predictor_model_path: models/traffic_predictor_model.h5
v2x:
  broadcast_ip: 255.255.255.255
  broadcast_port: 5005
  directive_interval_sec: 2.0
  enabled: false
vehicle_detection:
  bbox_expansion_factor: 0.05
  car_classification_enabled: false
  car_classification_interval_frames: 60
  car_classifier_labels_path: models/car_labels.txt
  car_classifier_model_path: models/Car_Make_Model.tflite
  confidence_threshold: 0.3
  enabled: true
  # Calibration: maps image pixels -> real-world ground plane (meters) via a
  # homography. Required for physically-meaningful speed (km/h). Without it the
  # pipeline falls back to pixel-based velocity (avg_speed broadcasts as 0.0).
  # image_points are NORMALIZED [0,1] and scaled by `resolution` at load time
  # -- so raising `frame_resolution` does NOT require editing image_points.
  # Edit these per-camera to match your scene; values below are a sane default
  # trapezoid for a forward-facing 640x480 traffic cam.
  calibration:
    resolution:
    - 640
    - 480
    image_points:
    - - 0.25
      - 0.25
    - - 0.75
      - 0.25
    - - 0.85
      - 0.95
    - - 0.15
      - 0.95
    world_points:
    - - -6.0
      - 40.0
    - - 6.0
      - 40.0
    - - 6.0
      - 0.0
    - - -6.0
      - 0.0
  frame_resolution:
  - 640
  - 480
  low_confidence_threshold: 0.1
  max_active_tracks: 100
  max_reid_per_frame: 2
  min_bbox_area: 100
  min_bbox_dimension: 5
  model_path: models/yolov8n.pt
  model_type: yolo
  nms_threshold: 0.45
  occlusion_confidence_threshold: 0.2
  openvino_model_path: backend/models/OpenVino/yolov8n.xml
  predict_timeout: 0.8
  probation_threshold: 2
  proximity_threshold: 80
  reid:
    appearance_weight: 0.3
    backbone: mobilenet_v3_small
    embedding_dim: 128
    input_size:
    - 256
    - 256
    min_track_age_for_appearance: 5
    model_path: ''
    # ReID match threshold. 0.80 was too strict for mobilenet_v3_small embeddings
    # on small 640x480-detected crops: re-entering vehicles (embedding drifts with
    # crop/pose) often scored just under 0.80 and were RE-REGISTERED as new global
    # ids -- observed 832 identities on a LOOPED sample feed. 0.70 sits in the
    # typical same-vehicle band (0.70-0.85) so returning cars match their existing
    # id instead of churning. Lower it further if regs still >> matches.
    similarity_threshold: 0.70
    # Interval (s) for the [ReID] gallery/matches/regs churn telemetry.
    log_interval_seconds: 60.0
    use_openvino: false
    # Full sync interval (seconds): throttle the expensive full Redis gallery
    # re-pull to prevent the "Syncing N new identities" storm (observed: 55
    # bursts in ~4 min). The pub/sub listener handles steady-state upkeep;
    # full_sync is only for cold-start catch-up. Default 30s.
    full_sync_interval_seconds: 30.0
  reid_enabled: true
  reid_interval_frames: 30
  reid_timeout: 3600
  # Per-frame ReID MATCH budget (read by inference_worker.py). Caps how many
  # NEW tracks run match_or_register per detect frame; each costs ~5 sync Redis
  # calls, and unbounded matching on dense scenes (130+ vehicles) pinned
  # workers to ~1 fps/feed. Remaining unassigned tracks get matched on later
  # frames as earlier ones receive global ids. 0 = disabled (motion-only
  # matching), higher = faster global-id assignment at more Redis cost.
  reid_match_budget_per_frame: 6
  # Fallback only — the worker reads inference.skip_frames first (see the
  # comment there); keep in sync so the fallback path also detects every
  # frame instead of skipping 2/3.
  skip_frames: 0
  static_movement_threshold: 25
  static_object_filter_enabled: true
  static_object_timeout: 20
  traffic_predictor:
    model_path: models/traffic_predictor_model.h5
  use_openvino: true
  vehicle_class_ids:
  - 2
  - 3
  - 5
  - 7
  # 640 -> 960 (workload increase): 2.25x per-detect GPU compute AND a real
  # accuracy gain on the 640x480 sources (1.5x supersample helps small/distant
  # vehicles). NOTE: a deployed TensorRT engine is shape-locked to its export
  # imgsz (320) and caps here at 320 (inference_worker.py trt_imgsz_cap) --
  # re-export the engine at 960 for this to bite. 1280 is available if you
  # want brute force (4x).
  yolo_imgsz: 960
video_input:
  max_queue_size: 500
  queue_put_timeout_ms: 1000
  webcam_buffer_size: 20
  webcam_index: 0
video_output:
  codec: mp4v
  enabled: false
  # fps at which the wire frame is emitted. Must match video_processing.target_fps
  # (result_processor.py dedups to ``video_output.fps``); they used to disagree
  # (15 vs 8) which silently capped effective throughput at the lower of the two.
  # Reduced from 15 to 8 to match sustainable ingestion/inference throughput.
  # Reduced from 8 to 5 to match sustainable inference throughput (~2-5 fps/worker).
  fps: 5
  frame_resolution:
  - 640
  - 480
  output_directory: backend/data/processed_videos
  processing_enabled: true
  # Wire JPEG for the dashboard. 640x480 at quality 80 is the cost ceiling for
  # the loca.lt tunnel; if you bump resolution further, lower jpeg_quality in
  # ingestion_worker.py accordingly (it's an inline constant there).
  stream_resolution:
  - 640
  - 480
video_processing:
  # target_fps 8 -> 15 (workload increase): +87% frames through ingestion and,
  # with inference.skip_frames=0, +87% detection work on the GPUs. The old
  # tunnel-bandwidth rationale is largely mitigated by the per-client rate
  # gate (tunnel clients are capped at 1-3fps per feed regardless). If tunnel
  # latency regresses, drop back to 8.
  # Reduced from 15 to 8 to match sustainable ingestion/inference throughput.
  # Reduced from 8 to 5 to match sustainable inference throughput (~2-5 fps/worker).
  target_fps: 5
  # Adaptive streaming: when TRUE the pipeline ships TWO JPEGs per frame
  # (full-res and a downscaled "small" tier) and lets the broadcaster pick by
  # client RTT. This is a bandwidth-conservation optimization for mixed
  # clients on the SAME origin -- a low-RTT LAN client gets full-res, a
  # high-RTT mobile client gets the small tier.
  #
  # Over a SINGLE loca.lt tunnel there is exactly one client, always
  # high-RTT, so the "small" tier is selected every frame -- meaning we
  # encode BOTH JPEGs and ship one. The second encode is pure waste.
  # Set FALSE to ship a single tier and cut the per-frame encoder cost in
  # half on the worker.
  adaptive_streaming: false
  # Downscale factor for the bandwidth-light ("small") background JPEG sent to
  # high-latency tunnel clients (loca.lt / cloudflare / ngrok).
  # The pipeline already force-resizes every frame to stream_resolution
  # (320x240) at ingestion, so the source ceiling is 320x240. A 0.5 factor
  # pushed tunnel clients down to 160x120 -- a 4x quality loss for a
  # negligible bandwidth saving on a 320x240 frame (~10-20KB JPEG). Set to
  # 1.0 so tunnel clients receive the full 320x240; this removes the visible
  # mushiness without materially increasing tunnel payload size.
  roi_scale: 1.0
  # JPEG quality for the small background. 50 was visibly mushy; 70 was a sane
  # floor; 78 keeps bandwidth-light frames watchable at full 320x240.
  adaptive_jpeg_quality: 78
  # RTT (ms) below which a client receives the full-res frame. Borderline
  # tunnels (100-250ms) were being forced onto the small tier at 120; raise so
  # only genuinely high-RTT links drop to the downscaled payload.
  adaptive_latency_threshold_ms: 250

vis_options_default:
- Grid Overlay
- Lane Lines
weather_service:
  enabled: false
websocket:
  max_connections: 1000
  # Aligned with frontend (WebSocketClient.ts: 10s ping, 60s pong timeout)
  # and main.py default (ping_interval=15, pong_timeout=60).
  # With 50-67s RTT over tunnel, a PONG legitimately returns at ~67s, just past
  # the 60s deadline -> both sides kill the connection (frontend code 1006) ->
  # reconnect ~16-30s -> stutter. Relaxed to 25s ping / 100s pong timeout so a
  # slow tunnel PONG clears the deadline; keepalive pings every 25s also keep
  # the tunnel (Cloud Workstations proxy) from idling out.
  ping_interval: 25
  pong_timeout: 100
  token_refresh_interval: 300

