# backend/configs/config.yaml
# Example Configuration for Route One Hub Backend

# --- General Settings ---
fps: 5 # Target processing FPS (workers might adjust dynamically)
speed_limit: 60 # Speed limit in km/h for 'speeding' classification

# --- Firebase Configuration ---
firebase_admin:
  service_account_key_path: configs/firebase/service-account-key.json
  project_id: gen-lang-client-0230118708
  auth_enabled: true

# --- Logging Configuration ---
logging:
  version: 1
  disable_existing_loggers: False
  formatters:
    standardFormatter:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    consoleHandler:
      class: logging.StreamHandler
      level: INFO
      formatter: standardFormatter
      stream: ext://sys.stdout
    mainFileHandler:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: standardFormatter
      filename: C:/Users/HP/Desktop/R1v0.1/backend/logs/backend_main.log
      maxBytes: 10485760 # 10 MB
      backupCount: 5
    workerFileHandler:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: standardFormatter
      filename: C:/Users/HP/Desktop/R1v0.1/backend/logs/backend_worker.log
      maxBytes: 10485760 # 10 MB
      backupCount: 5
    databaseFileHandler:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: standardFormatter
      filename: C:/Users/HP/Desktop/R1v0.1/backend/logs/backend_database.log
      maxBytes: 10485760 # 10 MB
      backupCount: 5
    servicesFileHandler:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: standardFormatter
      filename: C:/Users/HP/Desktop/R1v0.1/backend/logs/backend_services.log
      maxBytes: 10485760 # 10 MB
      backupCount: 5
    mlFileHandler:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: standardFormatter
      filename: C:/Users/HP/Desktop/R1v0.1/backend/logs/backend_ml.log
      maxBytes: 10485760 # 10 MB
      backupCount: 5
  loggers:
    # Root logger
    '':
      handlers: [consoleHandler, mainFileHandler]
      level: INFO
      propagate: True
    # Specific logger for the main application
