      handlers: [consoleHandler, mainFileHandler]
      level: INFO
      propagate: False # Prevent messages from being handled by root logger as well
    # Logger for processing workers (their loggers will be named 'Process-feed_id')
    'Process':
      handlers: [workerFileHandler]
      level: INFO
      propagate: False # Prevent messages from being handled by root logger
    # Logger for database operations
