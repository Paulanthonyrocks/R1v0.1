  detection_model: models/yolov8n.pt
  device: cuda:0
  # 2 T4 GPUs: start with 4 workers (2 per GPU) so the pool has
  # headroom immediately; the per-worker scale metric + raised cap let it
  # grow toward inference_pool_size (8) under real load. Feeds are
  # co-located onto the reduced SLOT_COUNT (4) so batches fill.
